<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="innerShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Circular text curves -->
    <path id="textArcTop" d="M 45, 200 A 155, 155 0 0, 1 355, 200" fill="none"/>
    <path id="textArcBottom" d="M 355, 200 A 155, 155 0 0, 1 45, 200" fill="none"/>
    <path id="arabicArcTop" d="M 75, 200 A 125, 125 0 0, 1 325, 200" fill="none"/>
  </defs>

  <!-- Outer Scalloped Gear / Islamic Star Polygon Backdrop -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6,4"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="200" cy="200" r="188" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="200" cy="200" r="182" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8"/>

  <!-- Middle Border Ring -->
  <circle cx="200" cy="200" r="136" fill="url(#innerShield)" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="200" cy="200" r="130" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3,3" opacity="0.9"/>

  <!-- Top Curved Bengali Institution Name -->
  <text font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="16.5" font-weight="900" fill="url(#goldGrad)" letter-spacing="1.2">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      জামিয়া আরাবিয়া ইমদাদুল উলূম ফরিদাবাদ
    </textPath>
  </text>

  <!-- Bottom Curved Location & Established Year -->
  <text font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="14.5" font-weight="700" fill="#fef3c7" letter-spacing="2">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      ★ ঢাকা-১২০৪ • স্থাপিত: ১৯৫৬ ঈ. ★
    </textPath>
  </text>

  <!-- Inner Dome & Minaret Silhouette -->
  <g transform="translate(200, 195)">
    <!-- Glow circle behind book -->
    <circle cx="0" cy="0" r="115" fill="#047857" opacity="0.25"/>

    <!-- Islamic Arch/Dome Contour -->
    <path d="M -55 -25 C -55 -65 0 -85 0 -85 C 0 -85 55 -65 55 -25 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.7"/>

    <!-- Crescent Moon at Top of Dome -->
    <path d="M 0 -105 A 18 18 0 0 1 -15 -80 A 15 15 0 0 0 -4 -102 Z" fill="url(#goldGrad)"/>
    <!-- Small Five Point Star -->
    <polygon points="-7,-92 -5.5,-88 -2,-88 -4.5,-86 -3.5,-83 -6.5,-85 -9.5,-83 -8.5,-86 -11,-88 -7.5,-88" fill="url(#goldGrad)"/>

    <!-- Arabic Calligraphy "اقْرَأْ" (Read) -->
    <text y="-52" font-family="'Noto Naskh Arabic', serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.6))">
      اقْرَأْ
    </text>

    <!-- Open Holy Quran on Rehal -->
    <!-- Pages -->
    <path d="M 0 -35 C -25 -48 -60 -42 -68 -24 C -68 -5 -35 4 0 -10 C 35 4 68 -5 68 -24 C 60 -42 25 -48 0 -35 Z" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <!-- Spine Center Line -->
    <line x1="0" y1="-35" x2="0" y2="-10" stroke="url(#goldGrad)" stroke-width="3"/>

    <!-- Quran text page lines -->
    <path d="M -56 -22 C -42 -30 -18 -26 0 -18" fill="none" stroke="#064e3b" stroke-width="2" stroke-linecap="round"/>
    <path d="M -54 -14 C -40 -22 -18 -18 0 -10" fill="none" stroke="#064e3b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 56 -22 C 42 -30 18 -26 0 -18" fill="none" stroke="#064e3b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 54 -14 C 40 -22 18 -18 0 -10" fill="none" stroke="#064e3b" stroke-width="2" stroke-linecap="round"/>

    <!-- Rehal (Wooden Stand) Cross Base -->
    <path d="M -40 2 L 40 44 M 40 2 L -40 44" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M -50 44 L 50 44" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Foundation Banner / Ribbon -->
    <g transform="translate(0, 72)">
      <rect x="-70" y="-12" width="140" height="22" rx="4" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5"/>
      <text y="4" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="11.5" font-weight="900" fill="#022c22" text-anchor="middle">
        ইলম • আমল • ইখলাস
      </text>
    </g>
  </g>
</svg>
